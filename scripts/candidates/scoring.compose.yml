# Evaluator-only override. The verifier talks to every dependency over the Compose network, so
# exposing fixed host ports only makes independent candidate scores collide with one another.
services:
  # Evaluator-only execution environment. It is defined in the private override rather than the
  # candidate-visible compose file, and hidden tests are mounted only by score.sh.
  verifier:
    build: .
    working_dir: /srv/payflow
    env_file: [.env.docker]
  provider-simulator:
    image: node:22-bookworm-slim
    working_dir: /opt/provider
    command: ["node", "/opt/provider/server.mjs"]
    environment:
      PROCESSOR_WEBHOOK_SECRET: processor-webhook-secret
      EVALUATOR_REFUND_FAILURE_AMOUNT: "2399"
    volumes:
      - ${PAYFLOW_EVALUATOR_DIR}:/opt/provider:ro
  postgres: { ports: !reset [] }
  redis: { ports: !reset [] }
  redpanda: { ports: !reset [] }
  minio: { ports: !reset [] }
  opensearch: { ports: !reset [] }
  mailpit: { ports: !reset [] }
  customer-service: { ports: !reset [] }
  payment-service:
    ports: !reset []
    environment:
      PROCESSOR_URL: http://provider-simulator:3002
  webhook-worker: { ports: !reset [] }
  api-gateway: { ports: !reset [] }
